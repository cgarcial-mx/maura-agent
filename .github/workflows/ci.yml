name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Evals deterministas (Safety + Falsability) + loop central + bayes + integridad.
  # AC9: bloquea el merge si la tasa de pass cae.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Integración contra Postgres real (cascada de borrado, JSONB, loop end-to-end).
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maura
          POSTGRES_PASSWORD: maura
          POSTGRES_DB: maura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maura -d maura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://maura:maura@localhost:5432/maura
      TEST_DATABASE_URL: postgres://maura:maura@localhost:5432/maura
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx vitest run src/agent/repo-drizzle.test.ts
