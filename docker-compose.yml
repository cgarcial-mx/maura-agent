services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maura
      POSTGRES_PASSWORD: maura
      POSTGRES_DB: maura
    ports:
      - "5432:5432"
    volumes:
      - maura-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maura -d maura"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  maura-pgdata:
